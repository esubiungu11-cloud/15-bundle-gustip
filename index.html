<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUNDLE 5 BUNGA</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
h1{font-size:16px;padding:12px;background:linear-gradient(90deg,#d4af37,#ff69b4);margin:0}
.box{width:95%;max-width:380px;margin:10px auto;aspect-ratio:9/16;position:relative;background:#000;border-radius:18px;overflow:hidden;border:2px solid #ff9ec3}
.slide{position:absolute;inset:0;display:none}
.slide.active{display:block}
.slide img{width:100%;height:100%;object-fit:contain;background:#000}
.dots{margin:10px}
.dot{display:inline-block;width:10px;height:10px;background:#444;border-radius:50%;margin:4px}
.dot.active{background:#ff69b4}
.btn{position:absolute;top:50%;background:rgba(255,255,255,0.8);border:none;width:34px;height:34px;border-radius:50%;font-size:20px;z-index:5}
.prev{left:8px}.next{right:8px}
#label{padding:10px;color:#ffb6d9;font-size:14px}
</style></head><body>
<h1> BUNDLE 5 WARNA BUNGA JASTIP </h1>
<div id="label">Loading...</div>
<div class="box" id="box">
<button class="btn prev" onclick="g(-1)">‹</button>
<button class="btn next" onclick="g(1)">›</button>
</div>
<div class="dots" id="dots"></div>
<script>
const files=[
"IMG-20261012-WA8486.jpg",
"IMG-20261012-WA0245.jpg",
"IMG-20261012-WA3990.jpg",
"IMG-20261012-WA4684.jpg",
"IMG-20261012-WA8445.jpg"
];
const names=["ROSE GOLD BUNGA","GOLD BLACK BUNGA","PLATINUM BUNGA","ROSE PINK BUNGA","ROSE UNGU BUNGA"];
let cur=0;
const box=document.getElementById('box');
const dots=document.getElementById('dots');
files.forEach((f,i)=>{
  let d=document.createElement('div');d.className='slide'+(i==0?' active':'');
  d.innerHTML=`<img src="${f}">`;box.appendChild(d);
  let dot=document.createElement('span');dot.className='dot'+(i==0?' active':'');dot.onclick=()=>go(i);dots.appendChild(dot);
});
function update(){
  document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i==cur));
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i==cur));
  document.getElementById('label').innerText=(cur+1)+"/5 - "+names[cur];
}
function go(n){cur=n;if(cur<0)cur=4;if(cur>4)cur=0;update()}
function g(d){go(cur+d)}
setInterval(()=>g(1),3000);
let sx=0;
box.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
box.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(dx>50)g(-1);if(dx<-50)g(1);});
update();
</script>
</body></html>
